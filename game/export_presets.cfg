; Export presets. Checked in so every build comes out the same way.
;
; The one line that matters most is `include_filter`: Godot only ships files it
; recognises as resources, and `.dlg` and `.json` are neither. Without them
; listed here every conversation in the game is missing from the build - and it
; runs fine from the editor, so nothing warns you.
;
; Android needs local machine setup (SDK path and a signing keystore) that must
; NOT be committed. See docs/build/android.md; the keystore lives in
; C:\temp\_secrets and its path goes in the editor's Android settings, not here.

[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.dlg,*.json"
exclude_filter="tests/*,tools/*,addons/godot_mcp/*,.ai-game-dev/*,.godot-mcp/*"
export_path="../build/windows/OfficerChoi.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="Officer Choi"
application/product_name="Officer Choi"
application/file_description="Officer Choi"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
ssh_remote_deploy/enabled=false

